spring:
  application:
    name: streamvibe-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/streamvibe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: StreamVibeSecretKey2026ForJWTTokenGenerationAndValidationMustBeLongEnough
  expiration: 86400000

logging:
  level:
    com.streamvibe: INFO
    org.hibernate.SQL: WARN
