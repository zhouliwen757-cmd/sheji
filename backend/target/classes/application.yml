spring:
  application:
    name: streamvibe-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/streamvibe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

jwt:
  secret: StreamVibeSecretKey2026ForJWTTokenGenerationAndValidation
  expiration: 86400000

logging:
  level:
    com.streamvibe: DEBUG
